<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Babylon Lite - accessible scene controls</title>
        <script>
            (() => {
                const param = new URLSearchParams(window.location.search).get("scoutTheme");
                const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            })();
        </script>
        <style>
            :root {
                color-scheme: light;
                --cp-bg: #f7f4ef;
                --cp-bg-elevated: #fcfbf8;
                --cp-surface: #ffffff;
                --cp-surface-soft: #f5f5f5;
                --cp-border: #dedede;
                --cp-border-strong: #919191;
                --cp-text: #242424;
                --cp-text-muted: #5c5c5c;
                --cp-text-soft: #6f6f6f;
                --cp-accent: #b11f4b;
                --cp-accent-hover: #9a1a41;
                --cp-accent-soft: rgba(177, 31, 75, 0.08);
                --cp-accent-fg: #ffffff;
                --cp-success: #16a34a;
                --cp-danger: #dc2626;
                --cp-warning: #f59e0b;
                --cp-link: #0078d4;
                --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
                --cp-overlay: rgba(255, 255, 255, 0.8);
                --cp-panel: rgba(255, 255, 255, 0.86);
                --cp-panel-strong: rgba(255, 255, 255, 0.96);
                --cp-sheen: rgba(255, 255, 255, 0.55);
                --cp-highlight: rgba(177, 31, 75, 0.12);
            }
            html[data-theme="dark"] {
                color-scheme: dark;
                --cp-bg: #3d3b3a;
                --cp-bg-elevated: #343231;
                --cp-surface: #292929;
                --cp-surface-soft: #2e2e2e;
                --cp-border: #474747;
                --cp-border-strong: #5f5f5f;
                --cp-text: #dedede;
                --cp-text-muted: #919191;
                --cp-text-soft: #b0b0b0;
                --cp-accent: #fd8ea1;
                --cp-accent-hover: #fb7b91;
                --cp-accent-soft: rgba(253, 142, 161, 0.14);
                --cp-accent-fg: #1a1a1a;
                --cp-success: #4ade80;
                --cp-danger: #f87171;
                --cp-warning: #fbbf24;
                --cp-link: #4da6ff;
                --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
                --cp-overlay: rgba(41, 41, 41, 0.88);
                --cp-panel: rgba(41, 41, 41, 0.72);
                --cp-panel-strong: rgba(41, 41, 41, 0.96);
                --cp-sheen: rgba(255, 255, 255, 0.04);
                --cp-highlight: rgba(253, 142, 161, 0.12);
            }
            body {
                margin: 0 auto;
                padding: 24px;
                max-width: 960px;
                font-family:
                    "Segoe UI",
                    Aptos,
                    Calibri,
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: var(--cp-bg);
                color: var(--cp-text);
                --lite-accessibility-focus-color: var(--cp-accent);
            }
            canvas {
                display: block;
                width: 100%;
                height: 360px;
                border-radius: 16px;
            }
            section {
                margin-top: 16px;
                padding: 16px;
                border: 1px solid var(--cp-border);
                border-radius: 16px;
                background: var(--cp-surface);
            }
            button,
            input {
                font: inherit;
                accent-color: var(--cp-accent);
            }
            button {
                padding: 8px 16px;
                margin: 4px;
                border: 1px solid var(--cp-border-strong);
                border-radius: 0.625rem;
                color: var(--cp-text);
                background: var(--cp-bg-elevated);
                cursor: pointer;
            }
            label {
                display: block;
                margin: 12px 4px;
            }
            input {
                margin-left: 12px;
            }
            p {
                line-height: 1.5;
                color: var(--cp-text-muted);
            }
            a {
                color: var(--cp-link);
            }
            :focus-visible {
                outline: 3px solid var(--cp-accent);
                outline-offset: 3px;
            }
            #error {
                color: var(--cp-danger);
            }
            #form .babylonUnmute {
                position: static;
                margin: 4px;
            }
        </style>
    </head>
    <body>
        <h1>Accessible scene controls</h1>
        <p id="instructions">
            Tab into the object list. Enter or Space selects the sphere; its focus marker follows the scene. Native form controls remain separate from camera input.
        </p>
        <canvas id="renderCanvas" width="960" height="360" tabindex="0" aria-label="3D scene camera" aria-describedby="instructions"></canvas>
        <main>
            <section id="objects">
                <h2>Scene objects</h2>
                <output id="selection" aria-live="polite">No object selected</output>
            </section>
            <section id="controls">
                <h2>Motion and sound</h2>
                <div id="form"></div>
                <output id="audio-status" aria-live="polite">Audio stopped</output>
            </section>
        </main>
        <p id="error" role="alert"></p>
        <p><a href="./">Leave this example</a></p>
        <script type="module" src="./src/accessibility.ts"></script>
    </body>
</html>
